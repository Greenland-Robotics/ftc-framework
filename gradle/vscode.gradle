/**
 * vscode.gradle
 *
 * VS Code's Java extension cannot import Android Gradle projects directly. Its fallback for
 * plain folders doesn't work here either: it ignores any "src" folder that sits next to a
 * build.gradle, so robot/src, framework/src and pedro/src would all be "non-project files".
 *
 * Instead, this task describes the workspace as an Eclipse project, which the Java extension
 * imports as-is:
 *   - .vscode/classpath/  the robot module's compile classpath (FTC SDK, Pedro Pathing,
 *                         FtcRobotController and android.jar); test/ holds the framework's
 *                         test libraries (JUnit)
 *   - .project, .classpath, .settings/  (at the repository root) the team's modules as source
 *                         folders plus those libraries, compiled as Java 8 like the real build
 *
 * Run it after cloning and whenever dependencies change:
 *
 *      ./gradlew :robot:vscodeClasspath
 *
 * (or run the "Refresh VS Code classpath" task in VS Code). Android Studio ignores this file.
 */

// The team's modules, read from source by VS Code instead of as jars
def sourceFolders = ['robot/src', 'framework/src', 'framework/test', 'pedro/src', 'examples/general']

def root = rootProject.projectDir
def classpathDir = rootProject.file('.vscode/classpath')
def projectName = rootProject.name

tasks.register('vscodeClasspath', Sync) {
    group = 'ide'
    description = 'Exports the robot compile classpath and an Eclipse project so VS Code can resolve it.'

    // Configured lazily: AGP only creates debugCompileClasspath once the project is evaluated
    from(configurations.debugCompileClasspath.incoming.artifactView {
        // Unpacks AARs and resolves project(':FtcRobotController') to its classes jar
        attributes.attribute(Attribute.of('artifactType', String), 'android-classes-jar')
        // framework and pedro are already source folders in VS Code, so skip their jars
        componentFilter { id ->
            !(id instanceof ProjectComponentIdentifier) || id.projectPath == ':FtcRobotController'
        }
    }.files)
    from(androidComponents.sdkComponents.bootClasspath)
    into(classpathDir)

    // The framework's test libraries (JUnit) go in .vscode/classpath/test
    dependsOn(':framework:vscodeTestClasspath')
    preserve {
        include 'test/**'
    }

    // Unpacked AARs and project jars are all named classes.jar, so give each a unique, readable name
    eachFile { details ->
        if (details.name == 'classes.jar') {
            def project = details.file.path =~ /[\\\/]([^\\\/]+)[\\\/]build[\\\/]intermediates[\\\/]/
            def library = project ? project[0][1] : details.file.parentFile.parentFile.name
            details.name = "${library}-${details.file.absolutePath.md5().take(8)}.jar"
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    outputs.files(new File(root, '.project'), new File(root, '.classpath'),
            new File(root, '.settings/org.eclipse.jdt.core.prefs'))

    doLast {
        new File(root, '.project').text = """\
            <?xml version="1.0" encoding="UTF-8"?>
            <!-- Generated by ./gradlew :robot:vscodeClasspath (gradle/vscode.gradle) -->
            <projectDescription>
            \t<name>${projectName}</name>
            \t<comment></comment>
            \t<projects></projects>
            \t<buildSpec>
            \t\t<buildCommand>
            \t\t\t<name>org.eclipse.jdt.core.javabuilder</name>
            \t\t\t<arguments></arguments>
            \t\t</buildCommand>
            \t</buildSpec>
            \t<natures>
            \t\t<nature>org.eclipse.jdt.core.javanature</nature>
            \t</natures>
            </projectDescription>
            """.stripIndent()

        // android.jar provides the Java standard library, as on the robot, so there is no JDK entry
        def jars = fileTree(classpathDir) { include '**/*.jar' }.files
                .sort { a, b -> (a.name == 'android.jar' ? 0 : 1) <=> (b.name == 'android.jar' ? 0 : 1) ?: a.name <=> b.name }
        def entries = sourceFolders.collect { "\t<classpathentry kind=\"src\" path=\"${it}\"/>" } +
                jars.collect { "\t<classpathentry kind=\"lib\" path=\"${root.toPath().relativize(it.toPath()).toString().replace('\\', '/')}\"/>" } +
                ['\t<classpathentry kind="output" path="build/vscode"/>']
        new File(root, '.classpath').text =
                '<?xml version="1.0" encoding="UTF-8"?>\n' +
                '<!-- Generated by ./gradlew :robot:vscodeClasspath (gradle/vscode.gradle) -->\n' +
                '<classpath>\n' + entries.join('\n') + '\n</classpath>\n'

        new File(root, '.settings').mkdirs()
        new File(root, '.settings/org.eclipse.jdt.core.prefs').text = '''\
            eclipse.preferences.version=1
            org.eclipse.jdt.core.compiler.codegen.targetPlatform=1.8
            org.eclipse.jdt.core.compiler.compliance=1.8
            org.eclipse.jdt.core.compiler.source=1.8
            '''.stripIndent()
    }
}
