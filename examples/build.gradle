//
// build.gradle in examples
//
// Builds and runs the laptop examples in general/ (plain Java, no Android), such as the
// behavior tree visualizer:
//
//      ./gradlew :examples:run       the behavior tree basics
//      ./gradlew :examples:hive      drive a robot through the hive game with the keyboard
//
// The FTC examples in ftc/ are only for copying into robot/, so they are not built.
//
apply plugin: 'application'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java.srcDirs = ['general']
        resources.srcDirs = ['general']
        resources.includes = ['**/*.html']
    }
}

dependencies {
    implementation project(':framework')
}

application {
    mainClass = 'BehaviorBasics'
}

tasks.register('hive', JavaExec) {
    group = 'application'
    description = 'Drive a simulated robot through the hive game with the keyboard, with its behavior tree shown live.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'hive.HiveTeleOp'
}

tasks.withType(JavaExec).configureEach {
    // Pass -Dvisualizer.port=8766 (another port) or -Dvisualizer.browser=false through to the program
    systemProperties System.properties.findAll { it.key.toString().startsWith('visualizer.') }
    // The visualizer swaps each node's children for traced copies, which newer JDKs warn about
    if (JavaVersion.current() >= JavaVersion.toVersion(26)) {
        jvmArgs '--enable-final-field-mutation=ALL-UNNAMED'
    }
}
