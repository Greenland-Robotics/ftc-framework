# Runs the framework and sdk tests, builds the robot app and the laptop examples, and checks that
# the FTC examples and season robots still compile.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub's Ubuntu runners include the Android SDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test framework and sdk, build robot app and laptop examples
        # :examples:compileJava also checks that the sdk outside sdk/ftc stays plain Java
        run: ./gradlew --console=plain :framework:test :sdk:testDebugUnitTest :examples:compileJava :robot:assembleDebug

      - name: Compile the FTC examples
        # Install the examples into robot/ the way the README describes, then compile
        run: |
          cp examples/ftc/Intake.java robot/src/robot/subsystems/
          cp examples/ftc/Example*.java examples/ftc/Boilerplate*.java robot/src/robot/opmode/
          sed -i \
            -e 's|    // public final Roller intake;|    public final robot.subsystems.Intake intake;|' \
            -e 's|        // intake = register(new Roller(.*|        intake = register(new robot.subsystems.Intake(hardwareMap));|' \
            robot/src/robot/Robot.java
          grep -q "intake = register(new robot.subsystems.Intake" robot/src/robot/Robot.java
          ./gradlew --console=plain :robot:compileDebugJavaWithJavac

      - name: Compile the season examples
        # Lay each season's robot over robot/src/robot, as its README describes, then compile
        run: |
          for season in examples/ftc/seasons/*/; do
            git checkout -- robot && git clean -fdq robot
            cp -R "$season". robot/src/robot/
            echo "== $season"
            ./gradlew --console=plain -q :robot:compileDebugJavaWithJavac
          done
          git checkout -- robot && git clean -fdq robot

      - name: Run the general example
        run: |
          # The sdk outside sdk/ftc is plain Java, so it compiles without the FTC SDK
          javac -d build/examples $(find framework/src examples/general -name '*.java') \
            $(find sdk/src -name '*.java' -not -path 'sdk/src/sdk/ftc/*')
          java -cp build/examples BehaviorBasics --console
