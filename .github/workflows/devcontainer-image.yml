# Builds the dev container image and publishes it to GitHub Container Registry, so people
# can pull it instead of building it. Runs only when the image definition changes.
name: Dev container image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/devcontainer-image.yml
  pull_request:
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/devcontainer-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest (main only) and sha-<commit> tags
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Pull requests only check that the image builds; main publishes it
      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
